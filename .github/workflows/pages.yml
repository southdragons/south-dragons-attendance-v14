name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check Edge Functions
        run: npx --yes deno@2.9.6 check supabase/functions/team/index.ts supabase/functions/maintenance/index.ts
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generate static application
        run: npm run generate
        env:
          NUXT_PUBLIC_DATA_BACKEND: supabase
          NUXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
