name: Supabase availability check
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/maintenance.mjs health
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          MAINTENANCE_KEY: ${{ secrets.MAINTENANCE_KEY }}
